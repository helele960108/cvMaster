<!--
  cvMaster 微卡片细化方案，保持卡片语言并比较不同信息结构，不读写剪贴板。
  author: helele
  since: 2026-10-19
-->
<style>
#cv-micro-cards { --cv-bg:light-dark(#f6f5f2,#252628); --cv-panel:light-dark(#fffefd,#303133); --cv-text:light-dark(#34312e,#efede7); --cv-muted:light-dark(#7c7871,#aba79e); --cv-line:light-dark(#e7e3dc,#424244); --cv-copper:light-dark(#a9512c,#e6ab84); --cv-select:light-dark(#f0e5dc,#46372e); --cv-chip:light-dark(#ebe8e2,#393a3d); --cv-shadow:light-dark(#493c2921,#0005); color:var(--cv-text); font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; }
#cv-micro-cards * { box-sizing:border-box; }
#cv-micro-cards [hidden] { display:none!important; }
#cv-micro-cards .cv-stage { min-height:690px; padding:30px 16px 24px; display:flex; justify-content:center; align-items:flex-start; }
#cv-micro-cards .cv-app { width:350px; max-width:100%; height:610px; position:relative; background:var(--cv-bg); border:1px solid var(--cv-line); border-radius:20px; box-shadow:0 14px 36px var(--cv-shadow); display:flex; flex-direction:column; overflow:visible; font-size:13px; }
#cv-micro-cards .cv-app::before { content:''; position:absolute; width:16px; height:16px; top:-9px; left:calc(50% - 8px); transform:rotate(45deg); background:var(--cv-bg); border-left:1px solid var(--cv-line); border-top:1px solid var(--cv-line); border-radius:3px 0 0; }
#cv-micro-cards button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
#cv-micro-cards svg { width:15px; height:15px; flex-shrink:0; }
#cv-micro-cards .cv-header { display:flex; align-items:center; gap:8px; padding:19px 18px 15px; }
#cv-micro-cards .cv-brand { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:600; flex:1; letter-spacing:-.4px; }
#cv-micro-cards .cv-brand>i,#cv-micro-cards .cv-brand>svg { color:var(--cv-copper); }
#cv-micro-cards .cv-more { width:28px; height:28px; display:grid; place-items:center; color:var(--cv-muted); }
#cv-micro-cards .cv-search { display:flex; align-items:center; gap:8px; background:var(--cv-panel); border:1px solid var(--cv-line); border-radius:10px; margin:0 14px; padding:10px; color:var(--cv-muted); }
#cv-micro-cards input { border:0; background:none; color:var(--cv-text); font:inherit; width:100%; min-width:0; }
#cv-micro-cards input::placeholder { color:var(--cv-muted); }
#cv-micro-cards .cv-groups { display:flex; align-items:center; gap:3px; padding:11px 13px 5px; }
#cv-micro-cards .cv-groups button { border-radius:20px; padding:7px 10px; color:var(--cv-muted); font-size:12px; }
#cv-micro-cards .cv-groups button.active { background:var(--cv-select); color:var(--cv-copper); }
#cv-micro-cards .cv-plus { margin-left:auto; }
#cv-micro-cards .cv-types { display:flex; gap:3px; padding:0 13px 12px; border-bottom:1px solid var(--cv-line); }
#cv-micro-cards .cv-types button { padding:5px 9px; border-radius:6px; font-size:11px; color:var(--cv-muted); }
#cv-micro-cards .cv-types button.active { background:var(--cv-chip); color:var(--cv-text); }
#cv-micro-cards .cv-list { padding:8px; flex:1; min-height:0; }
#cv-micro-cards .cv-section { display:flex; align-items:center; gap:6px; padding:9px 10px 7px; font-size:10px; color:var(--cv-muted); letter-spacing:.5px; }
#cv-micro-cards .cv-section svg { width:11px; height:11px; }
#cv-micro-cards .cv-row { width:100%; display:flex; gap:10px; text-align:left; padding:12px 10px; border-radius:10px; position:relative; align-items:center; }
#cv-micro-cards .cv-row:hover,#cv-micro-cards .cv-row:focus-visible { background:var(--cv-chip); }
#cv-micro-cards .cv-row.selected { background:var(--cv-select); }
#cv-micro-cards .cv-row.selected::before { content:''; position:absolute; left:0; top:15px; bottom:15px; width:3px; border-radius:3px; background:var(--cv-copper); }
#cv-micro-cards .cv-kind { width:29px; height:32px; display:grid; place-items:center; color:var(--cv-muted); flex-shrink:0; }
#cv-micro-cards .cv-copy { flex:1; min-width:0; }
#cv-micro-cards .cv-title { font-size:12px; font-weight:500; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
#cv-micro-cards .cv-meta { display:flex; align-items:center; gap:5px; margin-top:7px; font-size:10px; color:var(--cv-muted); }
#cv-micro-cards .cv-meta time { margin-left:auto; white-space:nowrap; }
#cv-micro-cards .cv-source { display:inline-grid; place-items:center; width:13px; height:13px; border:1px solid var(--cv-line); background:var(--cv-panel); color:var(--cv-text); border-radius:4px; font-size:8px; font-weight:500; }
#cv-micro-cards .cv-tail { display:flex; align-items:center; gap:4px; color:var(--cv-muted); }
#cv-micro-cards .cv-tail svg { width:12px; height:12px; }
#cv-micro-cards .cv-tail .cv-pin { color:var(--cv-copper); }
#cv-micro-cards .cv-foot { border-top:1px solid var(--cv-line); display:flex; align-items:center; justify-content:space-between; min-height:38px; padding:10px 17px; font-size:10px; color:var(--cv-muted); }
#cv-micro-cards .cv-image { display:none; }
#cv-micro-cards .cv-excerpt { display:none; }
/* 三种微卡片共享同一低噪声表面与内容，区别在信息层次和横纵组织。 */
#cv-micro-cards .cv-list { display:flex; flex-direction:column; gap:9px; padding:12px; }
#cv-micro-cards .cv-section { display:none; }
#cv-micro-cards .cv-row { display:flex; flex-direction:column; align-items:stretch; gap:0; padding:13px; border:1px solid var(--cv-line); background:var(--cv-panel); border-radius:13px; box-shadow:0 2px 3px var(--cv-shadow); }
#cv-micro-cards .cv-row:hover { border-color:var(--cv-copper); background:var(--cv-panel); }
#cv-micro-cards .cv-row.selected { border-color:var(--cv-copper); background:var(--cv-panel); box-shadow:0 0 0 1px var(--cv-copper); }
#cv-micro-cards .cv-row.selected::before { display:none; }
#cv-micro-cards .cv-card-top { display:flex; align-items:center; gap:6px; color:var(--cv-muted); font-size:10px; margin-bottom:10px; }
#cv-micro-cards .cv-card-top time { margin-left:auto; }
#cv-micro-cards .cv-card-top svg { width:12px; height:12px; }
#cv-micro-cards .cv-card-top .cv-pin { color:var(--cv-copper); }
#cv-micro-cards .cv-body { display:flex; gap:12px; align-items:center; min-width:0; }
#cv-micro-cards .cv-title { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; white-space:normal; line-height:1.55; font-size:12px; font-weight:500; }
#cv-micro-cards .cv-excerpt { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1; overflow:hidden; font-size:11px; color:var(--cv-muted); margin-top:6px; line-height:1.6; }
#cv-micro-cards .cv-meta { margin-top:10px; font-size:10px; }
#cv-micro-cards .cv-meta .cv-kind-name { margin-left:auto; display:flex; align-items:center; gap:4px; }
#cv-micro-cards .cv-land { display:block; width:68px; height:60px; border-radius:8px; flex-shrink:0; background:linear-gradient(160deg,light-dark(#cadbdc,#637a7b) 40%,light-dark(#c4bba3,#878269) 41%,light-dark(#838d72,#4e5e45) 70%); }
#cv-micro-cards .cv-file-tile { display:grid; place-items:center; width:48px; height:54px; background:var(--cv-chip); color:var(--cv-copper); border-radius:8px; flex-shrink:0; }
#cv-micro-cards .cv-file-tile svg { width:24px; height:24px; }
#cv-micro-cards .cv-app[data-design="paper"] .cv-meta { display:none; }
#cv-micro-cards .cv-app[data-design="paper"] .cv-land { width:65px; height:48px; }
#cv-micro-cards .cv-app[data-design="paper"] .cv-body { flex-direction:row-reverse; }
#cv-micro-cards .cv-app[data-design="paper"] .cv-row { border-radius:10px; padding:12px 14px; box-shadow:none; }
#cv-micro-cards .cv-app[data-design="visual"] .cv-card-top { display:none; }
#cv-micro-cards .cv-app[data-design="visual"] .cv-land { width:76px; height:63px; }
#cv-micro-cards .cv-app[data-design="visual"] .cv-copy { align-self:flex-start; }
#cv-micro-cards .cv-app[data-design="visual"] .cv-row { padding:13px; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-row { flex-direction:row; gap:10px; align-items:center; padding:11px; border-radius:11px; box-shadow:none; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-card-top { display:none; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-body { flex:1; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-land { width:40px; height:44px; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-file-tile { width:40px; height:44px; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-title { -webkit-line-clamp:1; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-excerpt { display:none; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-meta { margin-top:7px; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-meta .cv-kind-name { display:none; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-meta time { margin-left:0; }
#cv-micro-cards .cv-dense-icon { display:none; }
#cv-micro-cards .cv-app[data-design="dense"] .cv-dense-icon { display:grid; width:30px; color:var(--cv-muted); flex-shrink:0; place-items:center; }
@media(max-width:390px) { #cv-micro-cards .cv-stage { padding:25px 5px; } #cv-micro-cards .cv-types button { padding-left:7px; padding-right:7px; } }
@media(pointer:coarse) { #cv-micro-cards .cv-groups button,#cv-micro-cards .cv-types button,#cv-micro-cards .cv-more { min-height:44px; } #cv-micro-cards .cv-app { height:650px; } #cv-micro-cards .cv-stage { min-height:730px; } }
</style>
<div id="cv-micro-cards">
  <div class="viz-carousel viz-dotted-background" aria-label="cvMaster 微卡片细化方案" data-previous-label="上一方案" data-next-label="下一方案">
    <section data-variant="轻纸笺" aria-label="轻纸笺"><div class="cv-stage"><div class="cv-app" data-design="paper" aria-label="轻纸笺设计"></div></div></section>
    <section data-variant="侧图卡片" aria-label="侧图卡片" hidden><div class="cv-stage"><div class="cv-app" data-design="visual" aria-label="侧图卡片设计"></div></div></section>
    <section data-variant="紧凑胶囊" aria-label="紧凑胶囊" hidden><div class="cv-stage"><div class="cv-app" data-design="dense" aria-label="紧凑胶囊设计"></div></div></section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('cv-micro-cards');
  const entries = [
    {title:'把灵感留住，把时间还给生活。',excerpt:'不必记住每一次复制，只需要在想起时，随手找回。',source:'备忘录',mark:'N',type:'文本',icon:'text',time:'11:38',pin:true,group:'工作'},
    {title:'Apple Human Interface Guidelines',excerpt:'developer.apple.com/design',source:'Safari',mark:'S',type:'链接',icon:'link',time:'11:35',pin:true,group:'工作'},
    {title:'山野之间 · 配色参考',excerpt:'PNG · 2560 × 1600',source:'截图',mark:'截',type:'图片',icon:'image',time:'11:32',group:'灵感'},
    {title:'让工具安静，让内容发声。',excerpt:'轻一点的界面，留更多空间给正在做的事。',source:'ChatGPT',mark:'✳',type:'文本',icon:'text',time:'11:30',group:'工作'},
    {title:'Brand Guidelines.pdf',excerpt:'文件引用 · 2.4 MB',source:'Finder',mark:'F',type:'文件',icon:'file-text',time:'11:26',group:'工作'},
    {title:'原生、轻盈、随手即得',excerpt:'搜索、分组与再次复制，集中在一个小浮层。',source:'备忘录',mark:'N',type:'文本',icon:'text',time:'11:20',group:'灵感'}
  ];
  const glyph = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  function icons() { if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}}); }
  root.querySelectorAll('.cv-app').forEach(app => {
    const state = {group:'全部',type:'全部类型',query:'',selected:0};
    app.innerHTML = `<header class="cv-header"><span class="cv-brand">${glyph('clipboard')}cvMaster</span><button class="cv-more" aria-label="更多操作">${glyph('ellipsis')}</button></header><label class="cv-search">${glyph('search')}<input type="search" placeholder="搜索剪贴板…" aria-label="搜索内容"></label><nav class="cv-groups" aria-label="分组">${['全部','置顶','工作','灵感'].map(x=>`<button data-group="${x}" class="${x==='全部'?'active':''}">${x}</button>`).join('')}<button class="cv-plus" aria-label="新建分组">${glyph('plus')}</button></nav><nav class="cv-types" aria-label="内容类型">${['全部类型','文本','链接','图片','文件'].map(x=>`<button data-type="${x}" class="${x==='全部类型'?'active':''}">${x}</button>`).join('')}</nav><div class="cv-list"></div><footer class="cv-foot"><span class="cv-feedback" role="status" aria-live="polite">6 条 · 本地保存</span><span>⌥Space</span></footer>`;
    function draw() {
      const shown = entries.map((e,i)=>({...e,index:i})).filter(e=>(state.type==='全部类型'||state.type===e.type)&&(state.group==='全部'||state.group==='置顶'&&e.pin||state.group===e.group)&&(e.title+' '+e.excerpt).toLowerCase().includes(state.query.toLowerCase()));
      const limit = app.dataset.design === 'dense' ? 5 : 3;
      app.querySelector('.cv-list').innerHTML = shown.length ? shown.slice(0,limit).map(e=>`<button class="cv-row ${e.index===state.selected?'selected':''}" data-row="${e.index}" aria-pressed="${e.index===state.selected}" aria-label="${e.title}，来自${e.source}"><span class="cv-card-top"><span class="cv-source" aria-hidden="true">${e.mark}</span>${e.source}<time>${e.time}</time>${e.pin?`<span class="cv-pin">${glyph('pin')}</span>`:glyph(e.icon)}</span><span class="cv-body">${e.type==='图片'?'<span class="cv-land" aria-label="山野配色示意"></span>':e.type==='文件'?`<span class="cv-file-tile">${glyph(e.icon)}</span>`:`<span class="cv-dense-icon">${glyph(e.icon)}</span>`}<span class="cv-copy"><span class="cv-title">${e.title}</span><span class="cv-excerpt">${e.excerpt}</span><span class="cv-meta"><span class="cv-source" aria-hidden="true">${e.mark}</span>${e.source}<time>${e.time}</time><span class="cv-kind-name">${glyph(e.icon)}${e.type}</span></span></span></span></button>`).join(''):'<div class="cv-empty">没有找到相关内容</div>';
      app.querySelector('.cv-feedback').textContent = shown.length+' 条 · 本地保存';
      icons();
    }
    app.addEventListener('click',event=>{
      const button=event.target.closest('button'); if(!button)return;
      if(button.dataset.group){state.group=button.dataset.group;app.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b===button));draw();}
      if(button.dataset.type){state.type=button.dataset.type;app.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b===button));draw();}
      if(button.dataset.row!==undefined){state.selected=Number(button.dataset.row);draw();app.querySelector('.cv-feedback').textContent='已选中 · '+entries[state.selected].type;}
      if(button.classList.contains('cv-plus')) app.querySelector('.cv-feedback').textContent='新建分组入口';
      if(button.classList.contains('cv-more')) app.querySelector('.cv-feedback').textContent='设置 · 暂停记录 · 退出';
    });
    app.querySelector('input').addEventListener('input',event=>{state.query=event.target.value;draw();});
    draw();
    if(globalThis.Tweak){const settings={gap:9};const tweak=new Tweak({container:app,onChange:()=>app.querySelector('.cv-list').style.gap=settings.gap+'px'});tweak.addSlider(settings,'gap',{label:'卡片间距',min:6,max:14,unit:'px'});}
  });
})();
</script>
