<!--
  cvMaster 列表视觉方案，用于选择后再落地原生实现，不读写剪贴板。
  author: helele
  since: 2026-10-19
-->
<style>
#cv-list-options { --cv-bg:light-dark(#f6f5f2,#252628); --cv-panel:light-dark(#fffefd,#303133); --cv-text:light-dark(#34312e,#efede7); --cv-muted:light-dark(#7c7871,#aba79e); --cv-line:light-dark(#e7e3dc,#424244); --cv-copper:light-dark(#a9512c,#e6ab84); --cv-select:light-dark(#f0e5dc,#46372e); --cv-chip:light-dark(#ebe8e2,#393a3d); --cv-shadow:light-dark(#493c2921,#0005); color:var(--cv-text); font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif; }
#cv-list-options * { box-sizing:border-box; }
#cv-list-options [hidden] { display:none!important; }
#cv-list-options .cv-stage { min-height:690px; padding:30px 16px 24px; display:flex; justify-content:center; align-items:flex-start; }
#cv-list-options .cv-app { width:350px; max-width:100%; height:610px; position:relative; background:var(--cv-bg); border:1px solid var(--cv-line); border-radius:20px; box-shadow:0 14px 36px var(--cv-shadow); display:flex; flex-direction:column; overflow:visible; font-size:13px; }
#cv-list-options .cv-app::before { content:''; position:absolute; width:16px; height:16px; top:-9px; left:calc(50% - 8px); transform:rotate(45deg); background:var(--cv-bg); border-left:1px solid var(--cv-line); border-top:1px solid var(--cv-line); border-radius:3px 0 0; }
#cv-list-options button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
#cv-list-options svg { width:15px; height:15px; flex-shrink:0; }
#cv-list-options .cv-header { display:flex; align-items:center; gap:8px; padding:19px 18px 15px; }
#cv-list-options .cv-brand { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:600; flex:1; letter-spacing:-.4px; }
#cv-list-options .cv-brand>i,#cv-list-options .cv-brand>svg { color:var(--cv-copper); }
#cv-list-options .cv-more { width:28px; height:28px; display:grid; place-items:center; color:var(--cv-muted); }
#cv-list-options .cv-search { display:flex; align-items:center; gap:8px; background:var(--cv-panel); border:1px solid var(--cv-line); border-radius:10px; margin:0 14px; padding:10px; color:var(--cv-muted); }
#cv-list-options input { border:0; background:none; color:var(--cv-text); font:inherit; width:100%; min-width:0; }
#cv-list-options input::placeholder { color:var(--cv-muted); }
#cv-list-options .cv-groups { display:flex; align-items:center; gap:3px; padding:11px 13px 5px; }
#cv-list-options .cv-groups button { border-radius:20px; padding:7px 10px; color:var(--cv-muted); font-size:12px; }
#cv-list-options .cv-groups button.active { background:var(--cv-select); color:var(--cv-copper); }
#cv-list-options .cv-plus { margin-left:auto; }
#cv-list-options .cv-types { display:flex; gap:3px; padding:0 13px 12px; border-bottom:1px solid var(--cv-line); }
#cv-list-options .cv-types button { padding:5px 9px; border-radius:6px; font-size:11px; color:var(--cv-muted); }
#cv-list-options .cv-types button.active { background:var(--cv-chip); color:var(--cv-text); }
#cv-list-options .cv-list { padding:8px; flex:1; min-height:0; }
#cv-list-options .cv-section { display:flex; align-items:center; gap:6px; padding:9px 10px 7px; font-size:10px; color:var(--cv-muted); letter-spacing:.5px; }
#cv-list-options .cv-section svg { width:11px; height:11px; }
#cv-list-options .cv-row { width:100%; display:flex; gap:10px; text-align:left; padding:12px 10px; border-radius:10px; position:relative; align-items:center; }
#cv-list-options .cv-row:hover,#cv-list-options .cv-row:focus-visible { background:var(--cv-chip); }
#cv-list-options .cv-row.selected { background:var(--cv-select); }
#cv-list-options .cv-row.selected::before { content:''; position:absolute; left:0; top:15px; bottom:15px; width:3px; border-radius:3px; background:var(--cv-copper); }
#cv-list-options .cv-kind { width:29px; height:32px; display:grid; place-items:center; color:var(--cv-muted); flex-shrink:0; }
#cv-list-options .cv-copy { flex:1; min-width:0; }
#cv-list-options .cv-title { font-size:12px; font-weight:500; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
#cv-list-options .cv-meta { display:flex; align-items:center; gap:5px; margin-top:7px; font-size:10px; color:var(--cv-muted); }
#cv-list-options .cv-meta time { margin-left:auto; white-space:nowrap; }
#cv-list-options .cv-source { display:inline-grid; place-items:center; width:13px; height:13px; border:1px solid var(--cv-line); background:var(--cv-panel); color:var(--cv-text); border-radius:4px; font-size:8px; font-weight:500; }
#cv-list-options .cv-tail { display:flex; align-items:center; gap:4px; color:var(--cv-muted); }
#cv-list-options .cv-tail svg { width:12px; height:12px; }
#cv-list-options .cv-tail .cv-pin { color:var(--cv-copper); }
#cv-list-options .cv-foot { border-top:1px solid var(--cv-line); display:flex; align-items:center; justify-content:space-between; min-height:38px; padding:10px 17px; font-size:10px; color:var(--cv-muted); }
#cv-list-options .cv-image { display:none; }
#cv-list-options .cv-excerpt { display:none; }
#cv-list-options .cv-app[data-design="content"] .cv-row { background:var(--cv-panel); border:1px solid var(--cv-line); border-radius:12px; margin-bottom:7px; padding:12px; align-items:flex-start; }
#cv-list-options .cv-app[data-design="content"] .cv-row.selected { border-color:var(--cv-copper); }
#cv-list-options .cv-app[data-design="content"] .cv-row.selected::before { display:none; }
#cv-list-options .cv-app[data-design="content"] .cv-kind { display:none; }
#cv-list-options .cv-app[data-design="content"] .cv-section { display:none; }
#cv-list-options .cv-app[data-design="content"] .cv-excerpt { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; font-size:11px; line-height:1.65; color:var(--cv-muted); margin-top:7px; }
#cv-list-options .cv-app[data-design="content"] .cv-image { display:block; width:65px; height:53px; border-radius:7px; flex-shrink:0; background:linear-gradient(165deg,light-dark(#c8d7d5,#687874) 45%,light-dark(#b2ae95,#7e7c66) 46%,light-dark(#777e64,#4c5742) 80%); }
#cv-list-options .cv-app[data-design="compact"] .cv-row { padding:10px 9px; border-radius:7px; border-bottom:1px solid var(--cv-line); }
#cv-list-options .cv-app[data-design="compact"] .cv-kind { width:18px; height:20px; }
#cv-list-options .cv-app[data-design="compact"] .cv-section { padding-top:12px; }
#cv-list-options .cv-app[data-design="compact"] .cv-meta { margin-top:5px; }
#cv-list-options .cv-app[data-design="compact"] .cv-tail { display:none; }
#cv-list-options .cv-app[data-design="compact"] .cv-title { font-size:11px; }
#cv-list-options .cv-ordinal { display:none; color:var(--cv-muted); font-size:10px; }
#cv-list-options .cv-app[data-design="compact"] .cv-ordinal { display:block; }
#cv-list-options .cv-empty { text-align:center; padding:30px 10px; font-size:12px; color:var(--cv-muted); }
@media(max-width:390px) { #cv-list-options .cv-stage { padding:25px 5px; } #cv-list-options .cv-types button { padding-left:7px; padding-right:7px; } }
@media(pointer:coarse) { #cv-list-options .cv-groups button,#cv-list-options .cv-types button,#cv-list-options .cv-more { min-height:44px; } #cv-list-options .cv-app { height:650px; } #cv-list-options .cv-stage { min-height:730px; } }
</style>
<div id="cv-list-options">
  <div class="viz-carousel viz-dotted-background" aria-label="cvMaster 列表设计方案" data-previous-label="上一方案" data-next-label="下一方案">
    <section data-variant="原生轻列表" aria-label="原生轻列表"><div class="cv-stage"><div class="cv-app" data-design="native" aria-label="原生轻列表设计"></div></div></section>
    <section data-variant="内容微卡片" aria-label="内容微卡片" hidden><div class="cv-stage"><div class="cv-app" data-design="content" aria-label="内容微卡片设计"></div></div></section>
    <section data-variant="极简高密度" aria-label="极简高密度" hidden><div class="cv-stage"><div class="cv-app" data-design="compact" aria-label="极简高密度设计"></div></div></section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('cv-list-options');
  const entries = [
    {title:'把灵感留住，把时间还给生活。',excerpt:'不必记住每一次复制，只需要在想起时，随手找回。',source:'备忘录',mark:'N',type:'文本',icon:'text',time:'11:38',pin:true,group:'工作'},
    {title:'Apple Human Interface Guidelines',excerpt:'developer.apple.com/design',source:'Safari',mark:'S',type:'链接',icon:'link',time:'11:35',pin:true,group:'工作'},
    {title:'山野之间 · 配色参考',excerpt:'PNG · 2560 × 1600',source:'截图',mark:'截',type:'图片',icon:'image',time:'11:32',group:'灵感'},
    {title:'让工具安静，让内容发声。',excerpt:'轻一点的界面，留更多空间给正在做的事。',source:'ChatGPT',mark:'✳',type:'文本',icon:'text',time:'11:30',group:'工作'},
    {title:'Brand Guidelines.pdf',excerpt:'文件引用 · 2.4 MB',source:'Finder',mark:'F',type:'文件',icon:'file-text',time:'11:26',group:'工作'},
    {title:'原生、轻盈、随手即得',excerpt:'搜索、分组与再次复制，集中在一个小浮层。',source:'备忘录',mark:'N',type:'文本',icon:'text',time:'11:20',group:'灵感'}
  ];
  const glyph = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  function icons() { if(globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}}); }
  root.querySelectorAll('.cv-app').forEach(app => {
    const state = {group:'全部',type:'全部类型',query:'',selected:0};
    app.innerHTML = `<header class="cv-header"><span class="cv-brand">${glyph('clipboard')}cvMaster</span><button class="cv-more" aria-label="更多操作">${glyph('ellipsis')}</button></header><label class="cv-search">${glyph('search')}<input type="search" placeholder="搜索剪贴板…" aria-label="搜索内容"></label><nav class="cv-groups" aria-label="分组">${['全部','置顶','工作','灵感'].map(x=>`<button data-group="${x}" class="${x==='全部'?'active':''}">${x}</button>`).join('')}<button class="cv-plus" aria-label="新建分组">${glyph('plus')}</button></nav><nav class="cv-types" aria-label="内容类型">${['全部类型','文本','链接','图片','文件'].map(x=>`<button data-type="${x}" class="${x==='全部类型'?'active':''}">${x}</button>`).join('')}</nav><div class="cv-list"></div><footer class="cv-foot"><span class="cv-feedback" role="status" aria-live="polite">6 条 · 本地保存</span><span>⌥Space</span></footer>`;
    function draw() {
      const shown = entries.map((e,i)=>({...e,index:i})).filter(e=>(state.type==='全部类型'||state.type===e.type)&&(state.group==='全部'||state.group==='置顶'&&e.pin||state.group===e.group)&&(e.title+' '+e.excerpt).toLowerCase().includes(state.query.toLowerCase()));
      app.querySelector('.cv-list').innerHTML = shown.length ? shown.slice(0, app.dataset.design==='content'?4:app.dataset.design==='native'?5:6).map((e,i)=>`${(i===0||shown[i-1].pin!==e.pin)?`<div class="cv-section">${e.pin?glyph('pin'):''}${e.pin?'置顶':'最近复制'}</div>`:''}<button class="cv-row ${e.index===state.selected?'selected':''}" data-row="${e.index}" aria-pressed="${e.index===state.selected}" aria-label="${e.title}，来自${e.source}"><span class="cv-kind">${glyph(e.icon)}</span>${e.type==='图片'?'<span class="cv-image" aria-label="山野配色示意"></span>':''}<span class="cv-copy"><span class="cv-title" style="display:block">${e.title}</span><span class="cv-excerpt">${e.excerpt}</span><span class="cv-meta"><span class="cv-source" aria-hidden="true">${e.mark}</span>${e.source}<time>${e.time}</time></span></span><span class="cv-tail">${e.pin?`<span class="cv-pin">${glyph('pin')}</span>`:''}${glyph('chevron-right')}</span><span class="cv-ordinal">${i+1}</span></button>`).join(''):'<div class="cv-empty">没有找到相关内容</div>';
      app.querySelector('.cv-feedback').textContent = shown.length+' 条 · 本地保存';
      icons();
    }
    app.addEventListener('click',event=>{
      const button=event.target.closest('button'); if(!button)return;
      if(button.dataset.group){state.group=button.dataset.group;app.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b===button));draw();}
      if(button.dataset.type){state.type=button.dataset.type;app.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b===button));draw();}
      if(button.dataset.row!==undefined){state.selected=Number(button.dataset.row);draw();app.querySelector('.cv-feedback').textContent='已选中 · '+entries[state.selected].type;}
      if(button.classList.contains('cv-plus')) app.querySelector('.cv-feedback').textContent='新建分组入口';
      if(button.classList.contains('cv-more')) app.querySelector('.cv-feedback').textContent='设置 · 暂停记录 · 退出';
    });
    app.querySelector('input').addEventListener('input',event=>{state.query=event.target.value;draw();});
    draw();
    if(globalThis.Tweak){const settings={radius:20};const tweak=new Tweak({container:app,onChange:()=>app.style.borderRadius=settings.radius+'px'});tweak.addSlider(settings,'radius',{label:'浮层圆角',min:14,max:26,unit:'px'});}
  });
})();
</script>
