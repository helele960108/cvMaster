<!-- author helele; since 2026-10-19; 时间筛选交互方案，不修改原生应用。 -->
<style>
#cv-time-designs .stage {min-height:650px;display:grid;place-items:center;padding:22px 8px;box-sizing:border-box}
#cv-time-designs .app {--cv-bg:light-dark(#efefef,#292929);--cv-card:light-dark(#fff,#363636);--cv-text:light-dark(#383838,#eee);--cv-sub:light-dark(#747474,#b3b3b3);--cv-line:light-dark(#d7d7d7,#484848);--cv-accent:light-dark(#ad582e,#e3a27d);--cv-soft:light-dark(#eaded7,#534035);position:relative;width:350px;max-width:100%;height:594px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--cv-bg);color:var(--cv-text);border:1px solid var(--cv-line);border-radius:23px;box-shadow:0 16px 38px #0002;font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;text-align:left}
#cv-time-designs .app:before {content:"";position:absolute;top:-7px;left:calc(50% - 7px);width:14px;height:14px;background:var(--cv-bg);border-top:1px solid var(--cv-line);border-left:1px solid var(--cv-line);transform:rotate(45deg)}
#cv-time-designs .app button {font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:8px;min-height:30px;padding:4px 8px;white-space:nowrap}
#cv-time-designs .app button:hover {background:var(--cv-soft)}
#cv-time-designs .app button[aria-pressed=true],#cv-time-designs .app .selected {background:var(--cv-soft);color:var(--cv-accent)}
#cv-time-designs .app svg {width:15px;height:15px;flex-shrink:0}
#cv-time-designs .header {display:flex;align-items:center;gap:8px;padding:18px 17px 11px;font-size:16px;font-weight:600}
#cv-time-designs .header>.mark {color:var(--cv-accent)}
#cv-time-designs .spacer {flex:1}
#cv-time-designs .search {display:flex;align-items:center;gap:7px;background:var(--cv-card);border-radius:10px;margin:0 13px 8px;padding:5px 10px;color:var(--cv-sub);height:34px}
#cv-time-designs .search input {border:0;outline-offset:3px;min-width:0;width:100%;background:transparent;color:var(--cv-text);font:inherit}
#cv-time-designs .groups,#cv-time-designs .types {display:flex;align-items:center;gap:3px;padding:1px 13px;font-size:12px;color:var(--cv-sub)}
#cv-time-designs .types {padding-bottom:9px;border-bottom:1px solid var(--cv-line)}
#cv-time-designs .types button {padding:4px 7px}
#cv-time-designs .list {flex:1;min-height:0;padding:11px;display:flex;flex-direction:column;gap:9px}
#cv-time-designs .clip {background:var(--cv-card);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:12px}
#cv-time-designs .clip p {margin:0;font-size:13px;font-weight:500;line-height:1.5}
#cv-time-designs .meta {display:flex;align-items:center;gap:5px;font-size:11px;color:var(--cv-sub)}
#cv-time-designs .file {display:flex;gap:10px;align-items:center}
#cv-time-designs .file>svg {width:28px;height:35px;color:var(--cv-sub)}
#cv-time-designs .footer {display:flex;align-items:center;gap:4px;min-height:38px;padding:0 14px;border-top:1px solid var(--cv-line);color:var(--cv-sub);font-size:11px}
#cv-time-designs .grip {width:36px;height:3px;border-radius:3px;background:var(--cv-line);margin:1px auto 7px}
#cv-time-designs .anchor {position:relative}
#cv-time-designs .menu {position:absolute;z-index:3;right:0;top:calc(100% + 6px);width:158px;padding:5px;background:var(--cv-card);border:1px solid var(--cv-line);border-radius:12px;box-shadow:0 9px 28px #0003;color:var(--cv-text)}
#cv-time-designs .menu[hidden] {display:none}
#cv-time-designs .menu button {width:100%;justify-content:space-between;padding:6px 10px;font-size:12px}
#cv-time-designs .menu .menu-title {font-size:11px;color:var(--cv-sub);padding:6px 10px}
#cv-time-designs .menu.up {top:auto;bottom:calc(100% + 9px);right:0}
#cv-time-designs .search .anchor {margin-right:-5px}
#cv-time-designs .search .current-dot {position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--cv-accent)}
#cv-time-designs .notice {display:none;color:var(--cv-accent);font-size:11px;padding:0 14px 6px}
#cv-time-designs .notice:not(:empty) {display:block}
@media(max-width:380px){#cv-time-designs .stage{padding:18px 0;min-height:650px}#cv-time-designs .types{gap:0}#cv-time-designs .types button{padding:4px 5px}}
</style>
<div id="cv-time-designs" class="viz-carousel viz-dotted-background" aria-label="cvMaster 紧凑时间筛选方案" data-previous-label="上一款" data-next-label="下一款">
<section data-variant="类型栏胶囊" aria-label="类型栏胶囊"><div class="stage"><div class="app" data-design="pill"></div></div></section>
<section data-variant="搜索栏时钟" aria-label="搜索栏时钟" hidden><div class="stage"><div class="app" data-design="search"></div></div></section>
<section data-variant="底栏时间入口" aria-label="底栏时间入口" hidden><div class="stage"><div class="app" data-design="footer"></div></div></section>
</div>
<template id="cv-time-shell">
<div class="header"><span class="mark"><i data-lucide="clipboard" aria-hidden="true"></i></span><span>cvMaster</span><span class="spacer"></span><button aria-label="更多操作"><i data-lucide="ellipsis" aria-hidden="true"></i></button></div>
<div class="search"><i data-lucide="search" aria-hidden="true"></i><input aria-label="搜索剪贴板" placeholder="搜索剪贴板…"><span class="search-slot"></span></div>
<div class="groups"><button class="selected">全部</button><button>置顶</button><button>未分组</button><span class="spacer"></span><button aria-label="新增分组"><i data-lucide="plus" aria-hidden="true"></i></button></div>
<div class="types"><button class="selected">全部</button><button>文本</button><button>链接</button><button>图片</button><button>文件</button><span class="spacer"></span><span class="type-slot"></span></div>
<div class="notice" aria-live="polite"></div>
<div class="list">
<article class="clip" data-age="today"><p>把重要的灵感留下，让下一次复制更轻松。</p><div class="meta"><i data-lucide="compass" aria-hidden="true"></i>Safari<span>· 刚刚</span><span class="spacer"></span><i data-lucide="text" aria-hidden="true"></i></div></article>
<article class="clip" data-age="today"><p>下个版本：保持轻巧，专注每一次顺手的操作。</p><div class="meta"><i data-lucide="sticky-note" aria-hidden="true"></i>备忘录<span>· 12分钟前</span><span class="spacer"></span><i data-lucide="text" aria-hidden="true"></i></div></article>
<article class="clip" data-age="yesterday"><div class="file"><i data-lucide="file-text" aria-hidden="true"></i><p>cvMaster 交互设计规范.pdf</p></div><div class="meta"><i data-lucide="folder" aria-hidden="true"></i>访达<span>· 昨天</span><span class="spacer"></span><i data-lucide="file" aria-hidden="true"></i></div></article>
<article class="clip" data-age="week"><p>developer.apple.com/design/</p><div class="meta"><i data-lucide="compass" aria-hidden="true"></i>Safari<span>· 3天前</span><span class="spacer"></span><i data-lucide="link" aria-hidden="true"></i></div></article>
</div>
<div class="footer"><span class="count">22 条 · 本地保存</span><span class="spacer"></span><span class="footer-slot"></span><span>⌥Space</span></div><div class="grip"></div>
</template>
<template id="cv-time-menu">
<div class="anchor"><button class="time-trigger" aria-label="时间筛选" aria-expanded="true"><i data-lucide="clock-3" aria-hidden="true"></i><span class="range-label">全部时间</span><i class="down" data-lucide="chevron-down" aria-hidden="true"></i></button><div class="menu" role="group" aria-label="时间范围"><div class="menu-title">复制时间</div><button data-range="全部时间" aria-pressed="true">全部时间<span>✓</span></button><button data-range="今天" aria-pressed="false">今天<span></span></button><button data-range="昨天" aria-pressed="false">昨天<span></span></button><button data-range="近7天" aria-pressed="false">近7天<span></span></button><button data-range="近30天" aria-pressed="false">近30天<span></span></button></div></div>
</template>
<script>
(()=>{
 const root=document.getElementById('cv-time-designs');
 const shell=document.getElementById('cv-time-shell');
 const picker=document.getElementById('cv-time-menu');
 root.querySelectorAll('.app').forEach(app=>{
  app.append(shell.content.cloneNode(true));
  const mode=app.dataset.design;
  const slot=app.querySelector(mode==='pill'?'.type-slot':mode==='search'?'.search-slot':'.footer-slot');
  slot.append(picker.content.cloneNode(true));
  const trigger=slot.querySelector('.time-trigger'),menu=slot.querySelector('.menu'),label=slot.querySelector('.range-label');
  let range='全部时间';
  if(mode==='pill')label.textContent='时间';
  if(mode==='search'){label.hidden=true;slot.querySelector('.down').remove();}
  if(mode==='footer'){menu.classList.add('up');}
  trigger.addEventListener('click',()=>{menu.hidden=!menu.hidden;trigger.setAttribute('aria-expanded',String(!menu.hidden));});
  app.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();}});
  app.addEventListener('click',e=>{if(!slot.contains(e.target)){menu.hidden=true;trigger.setAttribute('aria-expanded','false');}});
  function filter(){
   const query=app.querySelector('input').value.trim().toLowerCase();let count=0;
   app.querySelectorAll('.clip').forEach(row=>{const age=row.dataset.age;const matches=range==='全部时间'||range==='近7天'||range==='近30天'||(range==='今天'&&age==='today')||(range==='昨天'&&age==='yesterday');row.hidden=!(matches&&row.textContent.toLowerCase().includes(query));row.style.display=row.hidden?'none':'';if(!row.hidden)count++;});
   app.querySelector('.count').textContent=(range==='全部时间'&&!query?'22':count)+' 条 · 本地保存';
  }
  menu.querySelectorAll('[data-range]').forEach(button=>button.addEventListener('click',()=>{
   range=button.dataset.range;
   menu.querySelectorAll('[data-range]').forEach(b=>{b.setAttribute('aria-pressed',String(b===button));b.querySelector('span').textContent=b===button?'✓':'';});
   label.textContent=mode==='pill'&&range==='全部时间'?'时间':range;
   trigger.setAttribute('aria-label','时间筛选：'+range);trigger.classList.toggle('selected',range!=='全部时间');
   if(mode==='search'){app.querySelector('input').placeholder=range==='全部时间'?'搜索剪贴板…':'搜索剪贴板… · '+range;trigger.title='时间：'+range;}
   menu.hidden=true;trigger.setAttribute('aria-expanded','false');filter();
  }));
  app.querySelector('input').addEventListener('input',filter);
 });
})();
</script>
