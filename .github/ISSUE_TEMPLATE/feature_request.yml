name: 功能建议
description: 提出新功能、交互改进或平台差异建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue。涉及数据模型、采集策略、粘贴目标、权限、依赖或网络行为的变化，建议先讨论边界再实现。

  - type: dropdown
    id: platform
    attributes:
      label: 相关平台
      options:
        - macOS
        - Windows
        - 两个平台
        - 文档 / 构建 / 发布
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前不便或缺失的能力，不要先限定实现方式
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、边界和可能的替代方案
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: 隐私与安全影响
      description: 是否会新增采集内容、权限、网络访问、日志字段或第三方依赖？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案（可选）

  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，且没有在公开内容中放入真实剪贴板数据或个人信息
          required: true
